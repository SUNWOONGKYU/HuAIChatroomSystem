<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1180" viewBox="0 0 1900 1180" role="img" aria-label="HuAI Collab Chatroom System 작업흐름도">
  <defs>
    <style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#7c8aa5;stroke-width:2}.leader{fill:#fff1e8;stroke:#D9480F;stroke-width:3}.worker{fill:#f3edff;stroke:#7C3AED;stroke-width:3}.lane{fill:#fff;stroke:#dce3ee;stroke-width:2}.decision{fill:#fff8e8;stroke:#c98716;stroke-width:3}.audit{fill:#fff8db;stroke:#F2C94C;stroke-width:3}.done{fill:#e9f8ef;stroke:#38a169;stroke-width:3}.trace{fill:#eefdf8;stroke:#159a78;stroke-width:3}.title{font:700 38px Arial,'Malgun Gothic',sans-serif;fill:#172033}.sub{font:19px Arial,'Malgun Gothic',sans-serif;fill:#4b5568}.h{font:700 21px Arial,'Malgun Gothic',sans-serif;fill:#18202f}.txt{font:17px Arial,'Malgun Gothic',sans-serif;fill:#334155}.small{font:15px Arial,'Malgun Gothic',sans-serif;fill:#64748b}.arrow{stroke:#596170;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#596170"/></marker>
  </defs>
  <rect class="bg" width="1900" height="1180"/>
  <text class="title" x="70" y="70">HuAI 작업흐름도</text>
  <text class="sub" x="70" y="108">승인된 작업만 로컬 PC에서 실행되고, 의미 있는 결과물만 독립 검증으로 넘어갑니다. 필요한 기록은 /trace로 직접 조회합니다.</text>
  <rect class="lane" x="70" y="155" width="1760" height="145" rx="14"/>
  <text class="h" x="100" y="190">1. 요청</text><text class="txt" x="100" y="225">사람: @leader_chatroom_bot 작업 요청</text><text class="small" x="100" y="255">사람끼리 대화는 그냥 말하고, AI에게 시킬 때만 멘션합니다.</text>
  <text class="h" x="980" y="190">조회 명령</text><text class="txt" x="980" y="225">/tasks · /task &lt;id&gt; · /search &lt;단어&gt; · /trace &lt;task_id&gt;</text><text class="small" x="980" y="255">작업 현황, 상세, 검색, 이벤트·산출물·검증 이력을 Telegram에서 확인합니다.</text>
  <rect class="leader" x="90" y="365" width="250" height="110" rx="14"/><text class="h" x="125" y="405">LeaderBot</text><text class="txt" x="125" y="438">작업 제안 작성</text><text class="small" x="125" y="463">실행 / 수정 / 반려</text>
  <rect class="decision" x="425" y="365" width="250" height="110" rx="14"/><text class="h" x="460" y="405">방장 결정</text><text class="txt" x="460" y="438">실행 승인</text><text class="small" x="460" y="463">중복 클릭은 1회 처리</text>
  <rect class="box" x="760" y="365" width="250" height="110" rx="14"/><text class="h" x="795" y="405">오케스트레이터</text><text class="txt" x="795" y="438">DB 기록 / 라우팅</text><text class="small" x="795" y="463">Supabase outbox 생성</text>
  <rect class="box" x="1095" y="365" width="250" height="110" rx="14"/><text class="h" x="1130" y="405">Local Gateway</text><text class="txt" x="1130" y="438">실제 폴더 실행</text><text class="small" x="1130" y="463">Codex 또는 Claude Code</text>
  <rect class="worker" x="1430" y="365" width="250" height="110" rx="14"/><text class="h" x="1465" y="405">작업자 봇</text><text class="txt" x="1465" y="438">짧은 결과 보고</text><text class="small" x="1465" y="463">내부 로그 숨김</text>
  <path class="arrow" d="M340 420 L425 420"/><path class="arrow" d="M675 420 L760 420"/><path class="arrow" d="M1010 420 L1095 420"/><path class="arrow" d="M1345 420 L1430 420"/>
  <rect class="decision" x="425" y="600" width="330" height="130" rx="14"/><text class="h" x="460" y="642">검증 필요 판정</text><text class="txt" x="460" y="676">의미 있는 결과물인가?</text><text class="small" x="460" y="706">보안, DB, 배포, 구현 완료, 문서 작성 등</text>
  <rect class="audit" x="880" y="600" width="330" height="130" rx="14"/><text class="h" x="915" y="642">AuditBot</text><text class="txt" x="915" y="676">독립 검증 또는 직접 감사</text><text class="small" x="915" y="706">검증 / 보완 / 완료</text>
  <rect class="done" x="1335" y="600" width="330" height="130" rx="14"/><text class="h" x="1370" y="642">완료 승인</text><text class="txt" x="1370" y="676">방장이 완료 선택</text><text class="small" x="1370" y="706">DB 상태를 완료로 고정</text>
  <path class="arrow" d="M1555 475 C1555 545 640 535 590 600"/><path class="arrow" d="M755 665 L880 665"/><path class="arrow" d="M1210 665 L1335 665"/><path class="arrow" d="M1045 730 C1045 815 595 815 595 730"/>
  <rect class="trace" x="250" y="845" width="1400" height="125" rx="14"/>
  <text class="h" x="290" y="885">기록 조회 경로</text><text class="txt" x="290" y="920">/trace &lt;task_id&gt; → huai_events, huai_artifacts, huai_verifications 조회 → Telegram으로 요약 출력</text><text class="small" x="290" y="950">이벤트 payload 원문은 제외하고, 산출물 URI의 민감 query 값은 마스킹합니다.</text>
  <rect class="lane" x="70" y="1025" width="1760" height="105" rx="14"/>
  <text class="h" x="100" y="1062">수동 감사 경로</text><text class="txt" x="100" y="1095">사람이 @audit_chatroom_bot 으로 감사나 보안 검토를 요청하면 AuditBot 작업으로 바로 접수합니다.</text><text class="small" x="100" y="1123">단순 확인성 작업에는 자동 검증을 붙이지 않아 Telegram 대화가 불필요하게 길어지지 않게 합니다.</text>
</svg>

