<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="robots" content="noindex, nofollow" />
<title>HuAI 작업 현황판</title>
<!--
  이 파일은 의도적으로 완전히 자기완결형이다 (외부 CSS/JS 파일, 번들러, 프레임워크 없음) —
  호스팅 방식이 아직 정해지지 않았고(작업 4), 파일 하나로 여는 게 가장 유연하기 때문이다.

  유일한 예외: 아래 telegram-web-app.js. Telegram Mini App 은 이 스크립트를
  Telegram 공식 도메인에서 직접 로드하는 것이 플랫폼 요구사항이다(자체 호스팅/미러링을
  Telegram 이 권장하지 않는다 — 봇 플랫폼이 이 스크립트를 계속 갱신하고, initData 발급이
  이 스크립트의 동작에 묶여 있다). "외부 CDN 의존 금지" 규칙의 취지는 UI 라이브러리를
  임의의 3rd-party CDN 에서 끌어오지 말라는 것이지, Mini App 이 존재하기 위한 필수
  플랫폼 SDK 까지 막는 것은 아니라고 판단해 이 한 줄만 예외로 두었다. 이견 있으면 알려달라.
-->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --bg-secondary: #f5f5f7;
    --text: #1c1c1e;
    --text-secondary: #6b6b70;
    --hint: #8e8e93;
    --border: #e2e2e5;
    --accent: #2563eb;
    --card-bg: #ffffff;
    --danger: #ef4444;
    --success: #10b981;
    --warn: #f59e0b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    max-width: 480px;
    margin-left: auto;
    margin-right: auto;
    min-height: 100vh;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
  }
  header h1 {
    font-size: 16px;
    margin: 0 0 2px;
    font-weight: 700;
  }
  header p {
    margin: 0;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .refresh-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 8px;
  }
  .refresh-row span {
    font-size: 11px;
    color: var(--hint);
  }
  /* 진행률. 목표서 최상위 목표가 "표·진행률로 한눈에" 인데 개수만 있었다 —
     숫자 다섯 개를 눈으로 더해야 얼마나 온 건지 알 수 있었다. */
  .progress { margin-top: 10px; }
  .progress-track {
    height: 6px;
    border-radius: 999px;
    background: var(--bg-secondary, #e9edf2);
    overflow: hidden;
  }
  .progress-fill {
    display: block;
    height: 100%;
    width: 0;
    border-radius: 999px;
    background: var(--accent, #2f86eb);
    transition: width 240ms ease;
  }
  .progress-caption {
    margin: 6px 0 0;
    font-size: 12px;
    color: var(--hint);
  }
  button {
    font-family: inherit;
  }
  .btn {
    border: 1px solid var(--border);
    background: var(--bg-secondary);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-accent { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
  .btn-ghost { background: transparent; }

  .tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 10px 16px 0;
    -webkit-overflow-scrolling: touch;
  }
  .tab {
    flex: 0 0 auto;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg-secondary);
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
  }
  .tab[aria-selected="true"] {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .tab .count { opacity: 0.75; margin-left: 4px; }

  main { padding: 12px 16px 32px; }

  #state-message {
    padding: 40px 16px;
    text-align: center;
    color: var(--text-secondary);
    font-size: 13px;
    line-height: 1.6;
  }

  .board-columns {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 8px;
  }
  .board-column {
    flex: 0 0 82%;
    scroll-snap-align: start;
    background: var(--bg-secondary);
    border-radius: 12px;
    padding: 10px;
    min-height: 120px;
  }
  .board-column h2 {
    font-size: 13px;
    margin: 2px 4px 8px;
    display: flex;
    justify-content: space-between;
    color: var(--text-secondary);
  }
  .board-column .empty {
    font-size: 12px;
    color: var(--hint);
    padding: 16px 4px;
    text-align: center;
  }

  .task-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    cursor: pointer;
    display: block;
    width: 100%;
    text-align: left;
    color: inherit;
  }
  .task-card .title {
    font-size: 13px;
    font-weight: 600;
    margin: 0 0 4px;
    line-height: 1.4;
  }
  .task-card .meta {
    font-size: 11px;
    color: var(--text-secondary);
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .pill {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 999px;
    background: var(--bg-secondary);
    font-size: 10px;
    font-weight: 700;
  }
  .pill.decidable { background: var(--warn); color: #1c1c1e; }
  .pill.priority-urgent { background: var(--danger); color: #fff; }
  .pill.priority-high { background: var(--warn); color: #1c1c1e; }

  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: none;
    z-index: 20;
  }
  #overlay.open { display: block; }
  #detail-sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    max-width: 480px;
    margin: 0 auto;
    background: var(--bg);
    border-radius: 16px 16px 0 0;
    padding: 16px 16px 24px;
    max-height: 82vh;
    overflow-y: auto;
    transform: translateY(100%);
    transition: transform 0.2s ease-out;
  }
  #overlay.open #detail-sheet { transform: translateY(0); }
  #detail-sheet h3 {
    margin: 4px 0 8px;
    font-size: 15px;
  }
  #detail-sheet .field {
    margin-bottom: 12px;
  }
  #detail-sheet .field label {
    display: block;
    font-size: 11px;
    color: var(--hint);
    margin-bottom: 2px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  #detail-sheet .field p {
    margin: 0;
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
  }
  .action-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 16px;
  }
  .action-row .btn { flex: 1 1 auto; }
  .reason-textarea {
    width: 100%;
    box-sizing: border-box;
    border: 1px solid var(--border);
    background: var(--bg-secondary);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
    line-height: 1.5;
    resize: vertical;
  }
  .reason-count {
    margin: 4px 0 0;
    font-size: 11px;
    color: var(--hint);
    text-align: right;
  }
  #reason-hint {
    color: var(--danger);
  }
  #decision-note {
    margin-top: 10px;
    font-size: 12px;
    color: var(--text-secondary);
    display: none;
  }
  #decision-note.show { display: block; }

  /* 인지부채 방지 퀴즈 — 완료 승인 전 이해도 확인용 객관식 3문항. */
  .quiz-question { margin-bottom: 14px; }
  .quiz-question p { font-size: 13px; font-weight: 600; margin: 0 0 6px; }
  .quiz-choice {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 4px;
    font-size: 13px;
    cursor: pointer;
  }
  .quiz-choice input { margin: 0; }

  /* 제안 섹션 — huai_tasks 기반 작업 현황판과 성격이 달라(아직 실행 시작 전) 탭/칸반과
     분리된 별도 섹션으로 둔다. 접었다 펼 수 있게 해서 제안이 없을 때 화면을 안 잡아먹는다. */
  #proposals-section {
    padding: 10px 16px 4px;
    border-bottom: 1px solid var(--border);
  }
  #proposals-toggle {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: none;
    border: none;
    padding: 6px 0;
    color: var(--text);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  #proposals-toggle .badge {
    background: var(--accent);
    color: #fff;
    border-radius: 999px;
    padding: 1px 8px;
    font-size: 11px;
    margin-left: 6px;
  }
  #proposals-toggle .chevron { transition: transform 0.15s; color: var(--hint); }
  #proposals-section.collapsed #proposals-toggle .chevron { transform: rotate(-90deg); }
  #proposals-section.collapsed #proposals-list { display: none; }
  #proposals-list { padding: 4px 0 10px; }
  /* 전문은 줄바꿈·들여쓰기가 뜻을 갖는다(표·코드블록). 접히지 않게 그대로 보여준다. */
  .report-body {
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 13px;
    line-height: 1.6;
    margin: 8px 0 0;
    font-family: inherit;
  }
  .artifact-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .artifact-list li { font-size: 13px; line-height: 1.4; word-break: break-all; }
  .artifact-list a { color: var(--accent); text-decoration: none; }
  .artifact-list a:active { opacity: 0.6; }
  /* 열 수 없는 산출물(이 PC 안의 경로)은 눌리지 않는다는 게 보여야 한다. */
  .artifact-list .not-openable { color: var(--hint); }

  .proposal-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .proposal-card .title { font-size: 13px; font-weight: 600; margin: 0 0 4px; line-height: 1.4; }
  .proposal-card .desc { font-size: 12px; color: var(--text-secondary); margin: 0 0 6px; line-height: 1.5; }
  .proposal-card .meta { font-size: 11px; color: var(--hint); display: flex; gap: 8px; flex-wrap: wrap; }
  #detail-hint {
    margin: 4px 0 10px;
    font-size: 12px;
    color: var(--hint);
    background: var(--bg-secondary);
    border-radius: 8px;
    padding: 8px 10px;
    line-height: 1.5;
  }
  .proposal-card .hint {
    margin-top: 6px;
    font-size: 11px;
    color: var(--hint);
    border-top: 1px dashed var(--border);
    padding-top: 6px;
  }
  .proposal-card .action-row { margin-top: 8px; }
  .proposal-card .proposal-note {
    margin-top: 6px;
    font-size: 11px;
    color: var(--text-secondary);
    display: none;
  }
  .proposal-card .proposal-note.show { display: block; }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --bg-secondary: #2c2c2e;
      --text: #f2f2f2;
      --text-secondary: #a0a0a5;
      --hint: #7c7c80;
      --border: #38383a;
      --card-bg: #2c2c2e;
    }
  }
</style>
</head>
<body>
  <header>
    <h1 id="room-title">HuAI 작업 현황판</h1>
    <p id="room-subtitle">불러오는 중…</p>
    <div id="progress" class="progress" hidden>
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="완료 진행률">
        <span class="progress-fill" id="progress-fill"></span>
      </div>
      <p class="progress-caption" id="progress-caption"></p>
    </div>
    <div class="refresh-row">
      <button type="button" class="btn btn-ghost" id="refresh-btn">새로고침</button>
      <span id="updated-at"></span>
    </div>
    <!-- 여기에 특정 방의 산출물 링크를 박으면 안 된다. 이 페이지는 21개 방이 공유하는
         한 벌이라, 헤더에 박힌 링크는 그 산출물을 만든 방과 무관하게 모든 방에 뜬다
         (달걀깨기 링크가 실제로 그렇게 새어나갔다). 작업 현황판이 보여주는 것은 roomId 로
         조회해 서버가 멤버십을 검증한 데이터뿐이어야 한다. 방별 산출물을 띄우려면
         방-산출물 목록을 서버에서 받아 렌더해야 하고, 그건 아직 없는 기능이다. -->
  </header>

  <section id="proposals-section" hidden>
    <button type="button" id="proposals-toggle" aria-expanded="true">
      <span>제안 (아직 시작 안 됨)<span class="badge" id="proposals-count">0</span></span>
      <span class="chevron">▾</span>
    </button>
    <div id="proposals-list"></div>
  </section>

  <nav class="tabs" id="tabs" role="tablist" aria-label="상태별 보기" hidden></nav>

  <main>
    <div id="state-message"></div>
    <div class="board-columns" id="board" hidden></div>
  </main>

  <div id="overlay">
    <div id="detail-sheet" role="dialog" aria-modal="true" aria-labelledby="detail-title">
      <h3 id="detail-title"></h3>
      <div class="field">
        <label>상태</label>
        <p id="detail-status"></p>
      </div>
      <div class="field">
        <label>목적</label>
        <p id="detail-purpose"></p>
      </div>
      <div class="field">
        <label>범위</label>
        <p id="detail-scope"></p>
      </div>
      <div class="field">
        <label>완료 기준</label>
        <p id="detail-criteria"></p>
      </div>
      <div class="field" id="detail-assignee-field" hidden>
        <label>담당</label>
        <p id="detail-assignee"></p>
      </div>
      <!-- 결과물. 이게 없으면 방장은 "완료"만 보고 무엇이 나왔는지는 방 대화를 거슬러 찾아야 한다. -->
      <div class="field" id="detail-artifacts-field" hidden>
        <label>결과물</label>
        <ul id="detail-artifacts" class="artifact-list"></ul>
      </div>
      <p id="detail-hint" class="hint" hidden></p>
      <div id="quiz-section" hidden>
        <p class="hint">완료를 승인하기 전에, 무엇이 바뀌었는지 확인하는 문제 3개입니다.</p>
        <div id="quiz-questions"></div>
        <p id="quiz-feedback" class="hint" hidden></p>
        <div class="action-row">
          <button type="button" class="btn btn-accent" id="quiz-submit-btn" style="flex:1 1 100%;">제출</button>
        </div>
      </div>
      <div class="action-row" id="action-row" hidden></div>
      <!-- 보완 요청 사유. [보완 요청] 버튼을 누르면 바로 전송하지 않고 여기를 먼저 연다 —
           사유는 필수다(공백만으로는 보내기가 비활성 상태로 남는다). 서버(miniapp-approve
           handler.ts)가 2000자로 자르므로 여기서도 같은 상한을 맞춘다. -->
      <div class="field" id="reason-section" hidden>
        <label for="reason-input">보완 사유 (필수)</label>
        <textarea id="reason-input" class="reason-textarea" rows="4" maxlength="2000" placeholder="무엇을 고쳐야 하는지 적어주세요"></textarea>
        <p id="reason-count" class="reason-count">0 / 2000</p>
        <p id="reason-hint" class="hint" hidden>무엇을 고쳐야 하는지 적어주세요</p>
        <div class="action-row">
          <button type="button" class="btn btn-accent" id="reason-send-btn" disabled>보내기</button>
          <button type="button" class="btn btn-ghost" id="reason-cancel-btn">취소</button>
        </div>
      </div>
      <div id="decision-note"></div>
      <div class="action-row">
        <button type="button" class="btn btn-ghost" id="close-detail-btn" style="flex:1 1 100%;">닫기</button>
      </div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  // ── 배포 시 채워야 하는 값. 자리표시자 그대로 두면 이 페이지는 아무 데이터도
  // 받아오지 못하고 명확한 에러 상태만 보여준다(조용히 실패하지 않는다).
  var CONFIG = {
    // 예: "https://YOUR_PROJECT.functions.supabase.co"
    functionsBaseUrl: "__MINIAPP_FUNCTIONS_BASE_URL__"
  };

  var qs = new URLSearchParams(window.location.search);
  // fn 쿼리 파라미터로 오버라이드 가능 — 같은 파일을 여러 Supabase 프로젝트에 재사용할 때 유용.
  var functionsBaseUrl = qs.get("fn") || CONFIG.functionsBaseUrl;

  var tg = window.Telegram && window.Telegram.WebApp;
  var initData = (tg && tg.initData) || "";

  // roomId 는 서명 검증 대상이 아니라 조회 키일 뿐이다 — 어느 경로로 받았든 서버
  // (miniapp-tasks/miniapp-proposals/miniapp-approve)가 huai_room_members 로 실제 접근
  // 권한을 다시 확인하므로, 이 값이 위조되어도 안전하다(위조하면 그냥 자기가 속하지 않은
  // 방이라 403/404를 받는다). 그래서 아래 세 경로 전부 "신뢰"가 아니라 "조회 키 후보"일
  // 뿐이고, 우선순위만 다르다.
  //
  // 우선순위 3단계 (그룹 진입 경로 변경 대응):
  //   1) ?room= / ?roomId= — 기존 방식. Telegram 정책상 web_app 버튼(인라인/메뉴/키보드/
  //      인라인쿼리)은 전부 "사설 채팅에서만" 지원되고 그룹에서는 아예 못 쓴다(Telegram
  //      공식 문서 확인, Bravo 조사). 그래도 1:1 채팅 메뉴 버튼 등 다른 진입 경로에서는
  //      여전히 유효할 수 있어 없애지 않는다.
  //   2) tgWebAppStartParam 쿼리 파라미터 — 그룹에서 유일하게 되는 진입 경로인 Direct Link
  //      Mini App(`https://t.me/<봇>/<앱>?startapp=<값>`)을 쓰면, Telegram 클라이언트가
  //      그 값을 이 GET 파라미터로 실어 페이지 URL에 붙여준다.
  //   3) Telegram.WebApp.initDataUnsafe.start_param — 같은 값이 initData 파싱 결과에도
  //      들어온다(공식 필드명). initDataUnsafe 는 클라이언트가 파싱만 한 것이라 서명
  //      검증이 안 된 값이다 — 하지만 위에서 말했듯 roomId 는 애초에 신뢰하지 않는 값이라
  //      서명 여부가 안전성에 영향을 주지 않는다.
  // resolve-room-id.test.mjs 가 이 함수를 파일에서 그대로 추출해 실행 검증한다(사본을
  // 손으로 복붙해 따로 테스트하면 나중에 둘이 어긋날 수 있어서, 실제 배포되는 이 함수
  // 정의 텍스트 자체를 읽어 실행한다) — 이 함수의 시그니처/이름을 바꾸면 그 테스트도 같이
  // 고쳐야 한다.
  function resolveRoomId(qs, tg) {
    return qs.get("room") || qs.get("roomId") || qs.get("tgWebAppStartParam") ||
      (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || "";
  }

  // 포럼 주제까지 실린 시작 파라미터를 가른다: "<roomId>__t<주제번호>".
  //
  // 방 하나 안에서 주제를 갈라 쓰면 작업 흐름도 갈린다. 주제마다 고정한 현황판이 방의
  // 모든 작업을 보여주면 주제를 나눈 의미가 없어진다. 구분자가 없으면 예전처럼 방 전체다.
  // resolve-room-id.test.mjs 가 이 함수 정의 텍스트를 파일에서 그대로 읽어 실행 검증한다.
  function parseStartParam(raw) {
    var value = String(raw || "");
    var index = value.indexOf("__t");
    if (index < 0) return { roomId: value, messageThreadId: "" };
    return { roomId: value.slice(0, index), messageThreadId: value.slice(index + 3) };
  }
  var rawStartParam = resolveRoomId(qs, tg);

  // "전문 보기" 버튼은 r_<reportId> 로 온다. 방 id 와 둘 다 UUID 라 접두어로만 구분된다.
  var reportRequestId = /^r_/.test(rawStartParam) ? rawStartParam.slice(2) : (qs.get("reportId") || "");

  var startParam = parseStartParam(rawStartParam);
  var roomId = startParam.roomId;
  var messageThreadId = qs.get("threadId") || startParam.messageThreadId;
  var threadQuery = messageThreadId ? "&threadId=" + encodeURIComponent(messageThreadId) : "";

  if (tg) {
    tg.ready();
    tg.expand();
    applyTelegramTheme();
    tg.onEvent && tg.onEvent("themeChanged", applyTelegramTheme);
  }

  function applyTelegramTheme() {
    var p = tg && tg.themeParams;
    if (!p) return;
    var root = document.documentElement.style;
    if (p.bg_color) root.setProperty("--bg", "#" + normalizeHex(p.bg_color));
    if (p.secondary_bg_color) root.setProperty("--bg-secondary", "#" + normalizeHex(p.secondary_bg_color));
    if (p.text_color) root.setProperty("--text", "#" + normalizeHex(p.text_color));
    if (p.hint_color) root.setProperty("--hint", "#" + normalizeHex(p.hint_color));
    if (p.hint_color) root.setProperty("--text-secondary", "#" + normalizeHex(p.hint_color));
    if (p.button_color) root.setProperty("--accent", "#" + normalizeHex(p.button_color));
  }
  function normalizeHex(v) { return String(v).replace(/^#/, ""); }

  // 전문 화면. 방에서 잘려 나간 보고를 통째로 보여준다.
  function renderFullReport(reportId) {
    stateEl.textContent = "불러오는 중…";
    apiFetch("/miniapp-tasks?reportId=" + encodeURIComponent(reportId), { method: "GET" })
      .then(function (res) {
        var report = res && res.report;
        if (!report) throw new Error("empty");
        document.title = "보고 전문";
        stateEl.textContent = "";
        // 헤더 부제가 "불러오는 중…" 에 멈춰 있으면 이 화면 전체가 아직도 로딩
        // 중이거나 고장난 것처럼 보인다 — 여기는 보고 전문만 보여주는 화면이라
        // 작업 목록/승인 버튼이 없는 게 정상임을 알려준다.
        subtitleEl.textContent = "보고 전문 — 작업 목록·승인은 방에 고정된 현황판 버튼에서 볼 수 있습니다.";
        boardEl.innerHTML = "";

        var wrap = document.createElement("div");
        wrap.className = "task-card";
        var title = document.createElement("p");
        title.className = "title";
        title.textContent = report.kind === "audit" ? "감사 보고 전문" : "실행 결과 전문";
        var meta = document.createElement("div");
        meta.className = "meta";
        meta.appendChild(pill(new Date(report.createdAt).toLocaleString("ko-KR")));
        var body = document.createElement("pre");
        body.className = "report-body";
        body.textContent = report.body;
        wrap.appendChild(title);
        wrap.appendChild(meta);
        wrap.appendChild(body);
        boardEl.appendChild(wrap);
      })
      .catch(function () {
        stateEl.textContent = "전문을 불러오지 못했습니다. 다시 시도해 주세요.";
      });
  }

  var BUCKET_ORDER = [
    { id: "needs_decision", label: "승인 필요" },
    { id: "in_progress", label: "진행 중" },
    { id: "backlog", label: "대기" },
    { id: "stopped", label: "중단" },
    { id: "done", label: "완료" }
  ];

  var stateEl = document.getElementById("state-message");
  var boardEl = document.getElementById("board");
  var tabsEl = document.getElementById("tabs");
  var titleEl = document.getElementById("room-title");
  var subtitleEl = document.getElementById("room-subtitle");
  var updatedAtEl = document.getElementById("updated-at");
  var refreshBtn = document.getElementById("refresh-btn");
  var overlayEl = document.getElementById("overlay");
  var closeDetailBtn = document.getElementById("close-detail-btn");

  var lastTasks = [];
  var activeBucket = "needs_decision";
  var pollTimer = null;

  function showState(message) {
    stateEl.textContent = message;
    stateEl.style.display = "block";
    boardEl.hidden = true;
    tabsEl.hidden = true;
  }

  function apiFetch(path, options) {
    if (!functionsBaseUrl || functionsBaseUrl.indexOf("__") === 0) {
      return Promise.reject(new Error("functions-base-url-not-configured"));
    }
    if (!initData) {
      return Promise.reject(new Error("no-telegram-init-data"));
    }
    options = options || {};
    options.headers = Object.assign({}, options.headers, {
      authorization: "tma " + initData
    });
    return fetch(functionsBaseUrl.replace(/\/$/, "") + path, options).then(function (res) {
      return res.json().then(function (body) {
        if (!res.ok) {
          var err = new Error((body && body.error) || ("http-" + res.status));
          err.status = res.status;
          throw err;
        }
        return body;
      });
    });
  }

  function friendlyErrorMessage(err) {
    if (err && err.message === "functions-base-url-not-configured") {
      return "이 작업 현황판은 아직 배포 설정이 끝나지 않았습니다. (functionsBaseUrl 미설정)";
    }
    if (err && err.message === "no-telegram-init-data") {
      return "Telegram 앱에서 열어야 합니다. 일반 브라우저에서는 사용할 수 없습니다.";
    }
    if (err && err.status === 401) return "인증에 실패했습니다. Telegram 앱을 다시 열어 시도해주세요.";
    if (err && err.status === 403) return "이 방의 작업 현황판을 볼 권한이 없습니다.";
    if (err && err.status === 404) return "방을 찾을 수 없습니다.";
    return "작업 목록을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.";
  }

  function loadTasks(isBackground) {
    if (!roomId) {
      showState("작업 현황판을 열 방이 지정되지 않았습니다. 방의 대화에서 제공된 버튼으로 다시 열어주세요.");
      return Promise.resolve();
    }
    if (!isBackground) showState("불러오는 중…");
    return apiFetch("/miniapp-tasks?roomId=" + encodeURIComponent(roomId) + threadQuery, { method: "GET" })
      .then(function (data) {
        stateEl.style.display = "none";
        tabsEl.hidden = false;
        boardEl.hidden = false;
        titleEl.textContent = (data.room && data.room.purpose) || "HuAI 작업 현황판";
        subtitleEl.textContent = "작업 " + (data.tasks ? data.tasks.length : 0) + "건";
        renderProgress(lastTasks);
        updatedAtEl.textContent = data.generatedAt ? "갱신 " + formatTime(data.generatedAt) : "";
        lastTasks = data.tasks || [];
        renderTabs();
        renderBoard();
      })
      .catch(function (err) {
        if (isBackground) return; // 백그라운드 폴링 실패는 조용히 넘어간다 (다음 주기에 재시도).
        showState(friendlyErrorMessage(err));
      });
  }

  // 제안(아직 huai_tasks 행이 없는, 실행을 시작시키는 승인 대상)은 작업 목록과 성격이
  // 달라 별도 섹션에 그린다. miniapp-approve 가 이제 proposalId 기반 결정도 받아주므로
  // owner 에게는 결정 버튼을 보여준다(owner 가 아니면 서버가 항상 403 을 낼 것이므로
  // 버튼 자체를 렌더링하지 않는다 — task 상세 시트의 decidable 패턴과 동일).
  var proposalsSection = document.getElementById("proposals-section");
  var proposalsToggle = document.getElementById("proposals-toggle");
  var proposalsList = document.getElementById("proposals-list");
  var proposalsCount = document.getElementById("proposals-count");
  var proposalsCollapsedByUser = false;
  var lastProposalsViewerRole = "";

  proposalsToggle.addEventListener("click", function () {
    proposalsCollapsedByUser = !proposalsSection.classList.contains("collapsed");
    proposalsSection.classList.toggle("collapsed");
    proposalsToggle.setAttribute("aria-expanded", String(!proposalsSection.classList.contains("collapsed")));
  });

  function loadProposals(isBackground) {
    if (!roomId) return;
    apiFetch("/miniapp-proposals?roomId=" + encodeURIComponent(roomId), { method: "GET" })
      .then(function (data) {
        var proposals = data.proposals || [];
        lastProposalsViewerRole = data.viewerRole || "";
        proposalsSection.hidden = proposals.length === 0;
        proposalsCount.textContent = String(proposals.length);
        // 처음 뜰 때는 펼쳐 보여주되, 사용자가 접었으면 백그라운드 갱신이 다시 펴지 않는다.
        if (proposals.length > 0 && !proposalsCollapsedByUser) proposalsSection.classList.remove("collapsed");
        renderProposals(proposals);
      })
      .catch(function () {
        // 제안 조회 실패는 작업 현황판 자체를 못 쓰게 만들 이유가 아니다 — 섹션을 그냥 숨긴다.
        if (!isBackground) proposalsSection.hidden = true;
      });
  }

  function renderProposals(proposals) {
    proposalsList.innerHTML = "";
    proposals.forEach(function (p) {
      var card = document.createElement("div");
      card.className = "proposal-card";
      var title = document.createElement("p");
      title.className = "title";
      title.textContent = p.title || "(제목 없음)";
      card.appendChild(title);
      if (p.purpose) {
        var desc = document.createElement("p");
        desc.className = "desc";
        desc.textContent = p.purpose;
        card.appendChild(desc);
      }
      var meta = document.createElement("div");
      meta.className = "meta";
      meta.appendChild(pill("담당 " + (p.assigneeDisplay || "미정")));
      meta.appendChild(pill(formatTime(p.createdAt) || "방금"));
      card.appendChild(meta);

      if (lastProposalsViewerRole === "owner") {
        var pActionRow = document.createElement("div");
        pActionRow.className = "action-row";
        var pNote = document.createElement("div");
        pNote.className = "proposal-note";
        [
          // 방의 제안 버튼과 같은 말을 쓴다(telegram-ui buildProposalKeyboard: 실행·수정·반려).
          // 같은 결정을 방에서는 "실행", 현황판에서는 "승인"이라 부르고 있었다.
          // 게다가 완료 단계에도 "승인"이 있어서, 한 화면에 같은 말이 다른 뜻으로 두 번 나왔다.
          { action: "approve", label: "실행", cls: "btn-accent" },
          { action: "request_revision", label: "수정", cls: "" },
          { action: "reject", label: "반려", cls: "btn-danger" }
        ].forEach(function (a) {
          var pBtn = document.createElement("button");
          pBtn.type = "button";
          pBtn.className = "btn " + a.cls;
          pBtn.textContent = a.label;
          pBtn.addEventListener("click", function () { submitProposalDecision(p, a.action, pBtn); });
          pActionRow.appendChild(pBtn);
        });
        card.appendChild(pActionRow);
        card.appendChild(pNote);
      } else {
        var hint = document.createElement("p");
        hint.className = "hint";
        hint.textContent = "Telegram 방에서 이 제안에 달린 버튼으로 승인/거부할 수 있습니다.";
        card.appendChild(hint);
      }

      proposalsList.appendChild(card);
    });
  }

  // 제안 카드는 detail 시트의 action-row/decision-note 처럼 DOM 에 하나만 있는 싱글턴이
  // 아니라 카드마다 새로 만들어지므로, 버튼을 클릭한 triggerBtn 을 기준으로 같은 카드
  // 안의 버튼 행(부모)과 상태 메시지(그 다음 형제 요소)를 찾아 쓴다.
  function submitProposalDecision(proposal, action, triggerBtn) {
    var rowEl = triggerBtn.parentNode;
    var noteEl = rowEl.nextElementSibling;
    var buttons = rowEl.querySelectorAll("button");
    for (var i = 0; i < buttons.length; i++) buttons[i].disabled = true;
    noteEl.className = "proposal-note show";
    noteEl.textContent = "처리 중…";

    // 제안 단계의 "수정"(action=request_revision, 레이블은 "수정")은 이번 작업 범위 밖이다
    // (팀장님 지시로 보류) — 완료 단계 [보완 요청]과 달리 여기는 아직 사유 입력란을 두지
    // 않았다. huai_approvals.reason 은 저장은 되지만 이 제안 경로에서는 아무도 읽지 않으므로
    // (task 경로만 orchestrator 까지 연결됐다 — buildSupplementRequestedText 참고), 입력란을
    // 두면 여전히 "적었으니 전달됐겠지"라는 거짓 안심을 준다. 그래서 성공 메시지도 그대로
    // "Telegram 방에 직접 알려야 한다"는 안내를 유지한다(decisionSuccessNote 의 kind="proposal" 분기).

    // task 결정과 동일한 패턴: 세션 내 고정된 idempotency 키로 중복 클릭을 막는다.
    // proposalId 와 taskId 는 서로 다른 채번 체계라 이 키 공간에서 충돌하지 않는다.
    var key = proposal.proposalId + ":" + action;
    if (!submittedKeys[key]) {
      submittedKeys[key] = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random();
    }

    var body = { proposalId: proposal.proposalId, action: action, idempotencyKey: submittedKeys[key] };

    apiFetch("/miniapp-approve", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body)
    })
      .then(function (res) {
        noteEl.textContent = decisionSuccessNote(action, res, "proposal");
        tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success");
        // 결정된 제안은 서버에서 목록 조인이 바뀌며 곧 사라진다 — 그대로 두고 목록만 새로고침한다.
        setTimeout(function () { loadProposals(true); }, 900);
      })
      .catch(function (err) {
        noteEl.textContent = decisionErrorMessage(err, "이미 다른 경로로 결정된 제안입니다. 새로고침해주세요.");
        tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("error");
        for (var i = 0; i < buttons.length; i++) buttons[i].disabled = false;
      });
  }

  function formatTime(iso) {
    try {
      var d = new Date(iso);
      return d.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
    } catch (e) {
      return "";
    }
  }

  function countByBucket(bucketId) {
    return lastTasks.filter(function (t) { return t.bucket === bucketId; }).length;
  }

  // 완료 진행률. 방장이 묻는 것은 "얼마나 왔나"인데 화면에는 상태별 개수만 있어서
  // 다섯 숫자를 눈으로 더해야 했다. 중단(stopped)은 분모에서 뺀다 — 취소·차단된 일까지
  // 세면 손대지 않아도 진행률이 오르내려 숫자가 거짓말을 한다.
  function computeProgress(tasks) {
    var counted = tasks.filter(function (t) { return t.bucket !== "stopped"; });
    var done = counted.filter(function (t) { return t.bucket === "done"; }).length;
    return { done: done, total: counted.length, percent: counted.length === 0 ? 0 : Math.round((done / counted.length) * 100) };
  }

  function renderProgress(tasks) {
    var progressEl = document.getElementById("progress");
    var fillEl = document.getElementById("progress-fill");
    var captionEl = document.getElementById("progress-caption");
    if (!progressEl || !fillEl || !captionEl) return;

    var p = computeProgress(tasks || []);
    if (p.total === 0) {
      progressEl.hidden = true;
      return;
    }
    progressEl.hidden = false;
    fillEl.style.width = p.percent + "%";
    var track = progressEl.querySelector(".progress-track");
    if (track) track.setAttribute("aria-valuenow", String(p.percent));

    var stopped = (tasks || []).filter(function (t) { return t.bucket === "stopped"; }).length;
    captionEl.textContent = "완료 " + p.done + " / " + p.total + " · " + p.percent + "%" + (stopped > 0 ? " (중단 " + stopped + "건 제외)" : "");
  }

  function renderTabs() {
    tabsEl.innerHTML = "";
    BUCKET_ORDER.forEach(function (b) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "tab";
      btn.setAttribute("role", "tab");
      btn.setAttribute("aria-selected", String(b.id === activeBucket));
      btn.innerHTML = b.label + '<span class="count">' + countByBucket(b.id) + "</span>";
      btn.addEventListener("click", function () {
        activeBucket = b.id;
        renderTabs();
        renderBoard();
      });
      tabsEl.appendChild(btn);
    });
  }

  function renderBoard() {
    boardEl.innerHTML = "";
    var bucketDef = BUCKET_ORDER.filter(function (b) { return b.id === activeBucket; })[0] || BUCKET_ORDER[0];
    var column = document.createElement("div");
    column.className = "board-column";
    var tasksInBucket = lastTasks.filter(function (t) { return t.bucket === bucketDef.id; });

    var heading = document.createElement("h2");
    heading.textContent = bucketDef.label;
    column.appendChild(heading);

    if (tasksInBucket.length === 0) {
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "이 칼럼에는 작업이 없습니다.";
      column.appendChild(empty);
    } else {
      tasksInBucket.forEach(function (task) {
        column.appendChild(renderCard(task));
      });
    }
    boardEl.appendChild(column);
  }

  function renderCard(task) {
    var card = document.createElement("button");
    card.type = "button";
    card.className = "task-card";
    var title = document.createElement("p");
    title.className = "title";
    title.textContent = task.title || "(제목 없음)";
    var meta = document.createElement("div");
    meta.className = "meta";
    meta.appendChild(pill(task.statusLabel));
    if (task.priority && task.priority !== "normal") {
      meta.appendChild(pill(task.priority, "priority-" + task.priority));
    }
    if (task.decidable) meta.appendChild(pill("결정 필요", "decidable"));
    card.appendChild(title);
    card.appendChild(meta);
    card.addEventListener("click", function () { openDetail(task); });
    return card;
  }

  // 결과물 목록. 주소가 있는 것만 링크로 만든다 — 눌러도 안 열리는 링크는 고장으로 읽힌다.
  function renderArtifacts(artifacts) {
    detailArtifacts.textContent = "";
    if (!artifacts.length) {
      detailArtifactsField.hidden = true;
      return;
    }
    detailArtifactsField.hidden = false;
    for (var i = 0; i < artifacts.length; i += 1) {
      var artifact = artifacts[i];
      var li = document.createElement("li");
      if (artifact.url) {
        var link = document.createElement("a");
        link.href = artifact.url;
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = artifact.name;
        li.appendChild(link);
      } else {
        li.className = "not-openable";
        li.textContent = artifact.name + " (이 PC에만 있음)";
      }
      detailArtifacts.appendChild(li);
    }
  }

  function pill(text, extraClass) {
    var span = document.createElement("span");
    span.className = "pill" + (extraClass ? " " + extraClass : "");
    span.textContent = text;
    return span;
  }

  // ── 상세 시트 ──
  var detailTitle = document.getElementById("detail-title");
  var detailStatus = document.getElementById("detail-status");
  var detailPurpose = document.getElementById("detail-purpose");
  var detailScope = document.getElementById("detail-scope");
  var detailCriteria = document.getElementById("detail-criteria");
  var detailAssigneeField = document.getElementById("detail-assignee-field");
  var detailAssignee = document.getElementById("detail-assignee");
  var actionRow = document.getElementById("action-row");
  var decisionNote = document.getElementById("decision-note");
  var detailHint = document.getElementById("detail-hint");
  var reasonSection = document.getElementById("reason-section");
  var reasonInput = document.getElementById("reason-input");
  var reasonCount = document.getElementById("reason-count");
  var reasonHint = document.getElementById("reason-hint");
  var reasonSendBtn = document.getElementById("reason-send-btn");
  var reasonCancelBtn = document.getElementById("reason-cancel-btn");
  var REASON_MAX_LENGTH = 2000; // miniapp-approve handler.ts 가 자르는 상한과 맞춘다.
  var detailArtifactsField = document.getElementById("detail-artifacts-field");
  var detailArtifacts = document.getElementById("detail-artifacts");
  var quizSection = document.getElementById("quiz-section");
  var quizQuestions = document.getElementById("quiz-questions");
  var quizFeedback = document.getElementById("quiz-feedback");
  var quizSubmitBtn = document.getElementById("quiz-submit-btn");
  var currentQuizTaskId = "";

  function openDetail(task) {
    detailTitle.textContent = task.title || "(제목 없음)";
    detailStatus.textContent = task.statusLabel + " (" + task.status + ")";
    detailPurpose.textContent = task.purpose || "-";
    detailScope.textContent = task.scope || "-";
    detailCriteria.textContent = task.completionCriteria || "-";
    if (task.assignee && task.assignee.role) {
      detailAssigneeField.hidden = false;
      detailAssignee.textContent = task.assignee.role + " (" + task.assignee.adapter_type + ")";
    } else {
      detailAssigneeField.hidden = true;
    }
    renderArtifacts(task.artifacts || []);
    decisionNote.className = "";
    decisionNote.textContent = "";
    reasonSection.hidden = true;
    reasonTask = null;
    resolveQuizThenActions(task);
    overlayEl.classList.add("open");
  }

  // 퀴즈는 "완료 승인"에만 건다 — 서버(miniapp-approve/handler.ts)도
  // action === "final_approve" 일 때만 퀴즈를 강제하고, 보완 요청은 애초에 검사하지
  // 않는다. 예전엔 여기서 퀴즈 여부부터 물어보고 통과해야만 버튼 자체를 그려서,
  // 결과가 마음에 안 들어 보완을 요청하려는 사람도 퀴즈부터 통과해야 하는
  // 앞뒤가 안 맞는 상태였다(반려하려는 사람에게 "뭐가 바뀌었는지 이해했냐"를
  // 먼저 묻는 셈이었다) — 방장 실사용 중 발견. 이제 버튼은 바로 그리고,
  // 퀴즈는 승인 버튼을 눌렀을 때만 확인한다(checkQuizThenApprove).
  function resolveQuizThenActions(task) {
    quizSection.hidden = true;
    quizFeedback.hidden = true;
    quizFeedback.textContent = "";
    currentQuizTaskId = task.taskId;
    renderActions(task);
  }

  function renderQuiz(task, questions) {
    quizQuestions.innerHTML = "";
    questions.forEach(function (question, qIndex) {
      var block = document.createElement("div");
      block.className = "quiz-question";
      var qText = document.createElement("p");
      qText.textContent = (qIndex + 1) + ". " + question.q;
      block.appendChild(qText);
      question.choices.forEach(function (choice, cIndex) {
        var label = document.createElement("label");
        label.className = "quiz-choice";
        var input = document.createElement("input");
        input.type = "radio";
        input.name = "quiz-q" + qIndex;
        input.value = String(cIndex);
        label.appendChild(input);
        label.appendChild(document.createTextNode(choice));
        block.appendChild(label);
      });
      quizQuestions.appendChild(block);
    });
    quizSection.hidden = false;
    quizSubmitBtn.disabled = false;
    quizSubmitBtn.textContent = "제출";

    quizSubmitBtn.onclick = function () {
      var answers = [];
      for (var i = 0; i < questions.length; i += 1) {
        var checked = quizQuestions.querySelector('input[name="quiz-q' + i + '"]:checked');
        if (!checked) {
          quizFeedback.hidden = false;
          quizFeedback.textContent = "모든 문항에 답해주세요.";
          return;
        }
        answers.push(Number(checked.value));
      }
      quizSubmitBtn.disabled = true;
      quizSubmitBtn.textContent = "채점 중…";
      quizFeedback.hidden = true;

      apiFetch("/miniapp-quiz", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ taskId: task.taskId, answers: answers })
      })
        .then(function (res) {
          if (res.passed) {
            quizSection.hidden = true;
            tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success");
            renderActions(task);
            return;
          }
          quizSubmitBtn.disabled = false;
          quizSubmitBtn.textContent = "다시 제출";
          quizFeedback.hidden = false;
          quizFeedback.textContent = "3문항 중 " + res.correctCount + "문항 정답입니다. " +
            (res.summary ? "설명: " + res.summary : "다시 확인하고 골라주세요.");
          tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("error");
        })
        .catch(function () {
          quizSubmitBtn.disabled = false;
          quizSubmitBtn.textContent = "다시 제출";
          quizFeedback.hidden = false;
          quizFeedback.textContent = "채점에 실패했습니다. 다시 시도해주세요.";
        });
    };
  }

  function closeDetail() {
    overlayEl.classList.remove("open");
    currentQuizTaskId = "";
    reasonSection.hidden = true;
    reasonTask = null;
  }
  closeDetailBtn.addEventListener("click", closeDetail);
  overlayEl.addEventListener("click", function (e) {
    if (e.target === overlayEl) closeDetail();
  });

  // 완료 단계(completion_approval_pending·commander_completion_pending)만 결정 가능하고
  // 둘 다 같은 결정(stage='final_approval')이라 버튼 구성도 같다 — Telegram 완료 게이트
  // (rv/rr/fa)에 맞춰 최종승인/보완요청만 두고 거부는 없다(팀장님 확정 사항).
  var FINAL_APPROVAL_ACTIONS = [
    // 제안 단계가 "실행"으로 바뀌어 이 화면에서 "승인"은 여기 하나뿐이다.
    // "최종"을 붙일 이유가 없어졌다 — 뭐에 대한 최종인지 읽는 사람이 알 수 없었다.
    { action: "final_approve", label: "승인", cls: "btn-accent" },
    { action: "request_revision", label: "보완 요청", cls: "" }
  ];

  function renderActions(task) {
    actionRow.innerHTML = "";
    if (!task.decidable) {
      actionRow.hidden = true;
      // decidable=false 인데 needs_decision 버킷(mid_approval_pending 등)이면 "왜 버튼이
      // 없는지"를 hint 로 설명한다 — 조용히 버튼만 없으면 방치된 것처럼 보인다.
      if (task.hint) {
        detailHint.textContent = task.hint;
        detailHint.hidden = false;
      } else {
        detailHint.hidden = true;
      }
      return;
    }
    detailHint.hidden = true;
    actionRow.hidden = false;
    var actions = FINAL_APPROVAL_ACTIONS;
    actions.forEach(function (a) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "btn " + a.cls;
      btn.textContent = a.label;
      btn.addEventListener("click", function () {
        // 보완 요청은 사유가 필수라 즉시 전송하지 않는다 — 먼저 사유 입력 UI를 연다.
        // 퀴즈와도 무관하다(서버가 request_revision 에는 퀴즈를 안 건다).
        if (a.action === "request_revision") {
          openReasonInput(task);
          return;
        }
        // 승인(final_approve)만 퀴즈를 먼저 확인한다.
        checkQuizThenApprove(task, Array.prototype.slice.call(actionRow.querySelectorAll("button")));
      });
      actionRow.appendChild(btn);
    });
  }

  // 승인 버튼을 눌렀을 때만 퀴즈 통과 여부를 확인한다 — 퀴즈가 없거나 이미
  // 통과했으면 바로 제출하고, 안 통과했으면 퀴즈부터 보여준다(통과 후
  // renderActions 가 다시 불려 액션 줄이 재생성되고, 다시 승인을 누르면
  // 이번엔 passed:true 로 응답이 와서 그대로 제출된다).
  function checkQuizThenApprove(task, buttons) {
    buttons.forEach(function (b) { b.disabled = true; });
    apiFetch("/miniapp-quiz?taskId=" + encodeURIComponent(task.taskId), { method: "GET" })
      .then(function (res) {
        if (currentQuizTaskId !== task.taskId) return; // 그 사이 다른 작업을 열었다.
        if (res.hasQuiz && !res.passed) {
          actionRow.hidden = true;
          detailHint.hidden = true;
          renderQuiz(task, res.questions);
          return;
        }
        submitDecision(task, "final_approve", buttons);
      })
      .catch(function () {
        // 퀴즈 조회 실패는 승인 자체를 막을 이유가 아니다 — 서버가 다시 강제한다.
        // 단, 조회가 실패하는 동안 사용자가 다른 작업을 열었다면 이 콜백은 이미
        // 화면에서 사라진 작업을 향한 것이다 — 여기서도 currentQuizTaskId 로
        // 걸러야 한다(V2 검증에서 지적됨: 이 가드가 없으면 엉뚱한 작업이 승인될 수 있다).
        if (currentQuizTaskId !== task.taskId) return;
        submitDecision(task, "final_approve", buttons);
      });
  }

  // ── 보완 요청 사유 입력 ──
  // action-row 를 감춘 자리에 이 UI를 대신 띄운다(같은 시트, 같은 위치) — action-row의
  // DOM 은 지우지 않고 hidden 만 토글하므로 취소 시 다시 렌더링할 필요 없이 그대로 되돌릴
  // 수 있다.
  var reasonTask = null;

  function openReasonInput(task) {
    reasonTask = task;
    actionRow.hidden = true;
    detailHint.hidden = true;
    reasonInput.value = "";
    reasonHint.hidden = true;
    updateReasonCount();
    reasonSection.hidden = false;
    reasonInput.focus();
  }

  function closeReasonInput() {
    reasonSection.hidden = true;
    reasonTask = null;
    actionRow.hidden = false;
  }

  function updateReasonCount() {
    var len = reasonInput.value.length;
    reasonCount.textContent = len + " / " + REASON_MAX_LENGTH;
    reasonSendBtn.disabled = reasonInput.value.trim().length === 0;
  }

  reasonInput.addEventListener("input", function () {
    reasonHint.hidden = true;
    updateReasonCount();
  });

  reasonCancelBtn.addEventListener("click", closeReasonInput);

  reasonSendBtn.addEventListener("click", function () {
    var reason = reasonInput.value.trim();
    if (!reason) {
      reasonHint.hidden = false;
      reasonHint.textContent = "무엇을 고쳐야 하는지 적어주세요";
      return;
    }
    if (!reasonTask) return;
    submitDecision(reasonTask, "request_revision", [reasonSendBtn, reasonCancelBtn], reason);
  });

  var submittedKeys = {};
  var submitting = false;

  // buttons: 제출 중 비활성화했다가 실패 시 다시 활성화할 버튼 목록. 승인/거부는
  // action-row 버튼 전체, 보완 요청은 사유 입력 UI의 보내기/취소 버튼이다 —
  // action-row 는 그때 감춰져 있어 그 버튼들을 건드릴 이유도 방법도 없다.
  // reason: 보완 요청일 때만 있다(선택). 있으면 요청 body 에 그대로 실어 보낸다.
  function submitDecision(task, action, buttons, reason) {
    // 버튼 disabled 만으로는 못 막는 경우가 있다 — 모바일에서 빠른 두 번 탭은 두 click
    // 이벤트가 이미 큐에 들어간 뒤에야 아래 disabled=true 가 실행돼, 두 번째 탭이 그 사이를
    // 비집고 들어간다(실측: 방장이 승인을 눌렀는데 "이미 결정된 건"이라는 에러가 떴다 —
    // 첫 번째 탭은 실제로 성공했고, 거의 동시에 들어간 두 번째 탭만 늦게 도착해 이미
    // completed 로 넘어간 상태를 만났다). 이 플래그가 그 틈을 막는 마지막 방어선이다.
    if (submitting) return;
    submitting = true;

    for (var i = 0; i < buttons.length; i++) buttons[i].disabled = true;
    decisionNote.className = "show";
    decisionNote.textContent = "처리 중…";

    // 같은 카드에서 같은 액션을 여러 번 눌러도 서버에는 한 번만 기록되도록
    // 세션 내 고정된 idempotency 키를 사용한다.
    var key = task.taskId + ":" + action;
    if (!submittedKeys[key]) {
      submittedKeys[key] = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random();
    }

    var body = { taskId: task.taskId, action: action, idempotencyKey: submittedKeys[key] };
    if (reason) body.reason = reason;

    apiFetch("/miniapp-approve", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body)
    })
      .then(function (res) {
        submitting = false;
        if (!reasonSection.hidden) closeReasonInput();
        decisionNote.textContent = decisionSuccessNote(action, res, "task");
        tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success");
        loadTasks(true);
        setTimeout(closeDetail, 900);
      })
      .catch(function (err) {
        // 409("이미 결정된 상태")는 위 레이스처럼 사실 내 요청이 성공한 뒤의 메아리일 수 있다.
        // 다시 불러와서 이 작업이 실제로 더는 결정 대상이 아니게 됐는지 먼저 확인한다 —
        // 맞으면 실패가 아니라 "이미 처리됨"으로 안내한다. 권한 없음 등 진짜 실패는
        // decidable 이 그대로 true 로 남으므로 원래 에러 메시지가 그대로 나간다.
        if (err && err.status === 409) {
          loadTasks(true).then(function () {
            submitting = false;
            var stillPending = lastTasks.some(function (t) { return t.taskId === task.taskId && t.decidable; });
            if (!stillPending) {
              decisionNote.textContent = "이미 처리되었습니다.";
              tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success");
              setTimeout(closeDetail, 900);
              return;
            }
            decisionNote.textContent = decisionErrorMessage(err);
            tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("error");
            for (var i = 0; i < buttons.length; i++) buttons[i].disabled = false;
          });
          return;
        }
        submitting = false;
        decisionNote.textContent = decisionErrorMessage(err);
        tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("error");
        for (var i = 0; i < buttons.length; i++) buttons[i].disabled = false;
      });
  }

  // task(완료 단계 [보완 요청])와 proposal(제안 단계 "수정") 둘 다 이 함수를 부른다 —
  // kind 로 갈라야 하는 이유: task 쪽 사유는 이제 실제로 담당자에게 닿지만(여기서 입력 →
  // miniapp-approve 핸들러가 huai_approvals.reason 에 저장 → Mini App 결정 폴러가 그 값을
  // 읽어 합성 콜백에 싣고 → orchestrator(buildSupplementRequestedText)가 방 알림 본문에
  // 그대로 포함시킨다), proposal 쪽 "수정"은 이번 범위 밖이라 여전히 사유 입력란도 없고
  // 아무도 그 값을 읽지 않는다(위 submitProposalDecision 주석 참고). 두 경로에 같은 문구를
  // 쓰면 proposal 쪽에서 "사유가 전달됩니다"라는 거짓 안심을 준다.
  function decisionSuccessNote(action, res, kind) {
    if (action === "request_revision" && kind === "task") {
      return "보완 요청을 전달했습니다. 적어주신 사유가 방과 담당자에게 함께 전달됩니다.";
    }
    if (action === "request_revision" && kind === "proposal") {
      return "수정 요청이 기록되었습니다. 무엇을 고쳐야 하는지는 Telegram 방에 직접 남겨주세요 — 버튼만으로는 반영되지 않습니다.";
    }
    return (res && res.note) || "결정이 기록되었습니다.";
  }

  function decisionErrorMessage(err, staleMessage) {
    if (err && err.status === 403) return "이 결정을 내릴 권한이 없습니다.";
    if (err && err.status === 409) return staleMessage || "이 작업은 더 이상 이 결정을 받을 수 있는 상태가 아닙니다. 새로고침해주세요.";
    return "기록에 실패했습니다. 다시 시도해주세요.";
  }

  refreshBtn.addEventListener("click", function () {
    if (reportRequestId) { renderFullReport(reportRequestId); return; }
    loadTasks(false);
    loadProposals(false);
  });

  // 실시간 대신 짧은 주기 폴링 — 인증 모델(작업 2)로 Realtime 을 쓰지 않기로 한
  // 데 따른 절충이다. Mini App 세션은 보통 짧으므로 5초 주기면 충분히 "실시간처럼" 느껴진다.
  function startPolling() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(function () { loadTasks(true); loadProposals(true); }, 5000);
  }
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { if (pollTimer) clearInterval(pollTimer); }
    else { loadTasks(true); loadProposals(true); startPolling(); }
  });

  // 전문 보기로 들어온 경우엔 목록을 부르지 않는다 — 방장이 보러 온 것은 그 보고 하나다.
  if (reportRequestId) {
    renderFullReport(reportRequestId);
  } else {
    loadTasks(false);
    loadProposals(false);
    startPolling();
  }
})();
</script>
</body>
</html>
