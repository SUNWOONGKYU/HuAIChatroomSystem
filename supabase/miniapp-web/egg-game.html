<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#f4c95d" />
<title>톡! 달걀깨기</title>
<style>
  :root {
    color-scheme: light;
    --ink: #31271b;
    --muted: #6c5b43;
    --cream: #fff9e9;
    --yolk: #f5a623;
    --sky: #9dd9d2;
    --ease-out: cubic-bezier(.23, 1, .32, 1);
    --ease-move: cubic-bezier(.77, 0, .175, 1);
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    min-height: 100svh;
    overflow: hidden;
    background:
      radial-gradient(circle at 18% 12%, rgba(255,255,255,.72) 0 8%, transparent 9%),
      linear-gradient(155deg, #f7d879 0 52%, #efb95b 52% 100%);
    color: var(--ink);
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", "Apple SD Gothic Neo", sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .game {
    min-height: 100svh;
    max-width: 560px;
    margin: 0 auto;
    padding: max(18px, env(safe-area-inset-top)) 20px max(18px, env(safe-area-inset-bottom));
    display: grid;
    grid-template-rows: auto 1fr auto;
    text-align: center;
  }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .back, .reset {
    min-width: 48px;
    min-height: 48px;
    border: 2px solid rgba(49,39,27,.16);
    border-radius: 999px;
    background: rgba(255,249,233,.8);
    color: var(--ink);
    display: inline-grid;
    place-items: center;
    padding: 0 16px;
    font: 700 14px/1 inherit;
    text-decoration: none;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(96,67,28,.16);
    transition: transform 140ms var(--ease-out), background-color 140ms ease;
  }
  .back:active, .reset:active { transform: translateY(2px) scale(.97); }
  .back:focus-visible, .reset:focus-visible, .egg-button:focus-visible { outline: 4px solid #175a62; outline-offset: 4px; }
  .title { margin: 0; font-size: clamp(20px, 6vw, 30px); letter-spacing: -.04em; }
  .score {
    min-width: 48px;
    text-align: right;
    font: 700 15px/1 "Trebuchet MS", "Apple SD Gothic Neo", sans-serif;
    color: var(--ink);
  }
  .stage { min-height: 0; display: grid; place-items: center; align-content: center; }
  .prompt { margin: 12px 0 4px; font-size: clamp(21px, 6.3vw, 34px); letter-spacing: -.035em; }
  .sub { min-height: 25px; margin: 0 0 8px; color: var(--muted); font: 700 15px/1.6 "Trebuchet MS", "Apple SD Gothic Neo", sans-serif; }
  .egg-button {
    position: relative;
    width: min(72vw, 310px);
    aspect-ratio: .77;
    margin: 2vh auto 0;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    touch-action: manipulation;
    filter: drop-shadow(0 24px 18px rgba(91,56,14,.24));
    transform: translateZ(0);
  }
  .egg-button::after {
    content: "";
    position: absolute;
    left: 12%; right: 12%; bottom: -4%; height: 9%;
    border-radius: 50%;
    background: rgba(77,47,14,.2);
    filter: blur(8px);
    transition: transform 220ms var(--ease-move), opacity 180ms ease;
  }
  .egg-svg { width: 100%; height: 100%; overflow: visible; transition: transform 150ms var(--ease-out); }
  .egg-button:active .egg-svg { transform: scale(.965); }
  .shell { fill: url(#shell); stroke: #d8c9a4; stroke-width: 3; }
  .shine { fill: none; stroke: rgba(255,255,255,.75); stroke-width: 12; stroke-linecap: round; }
  .crack { fill: none; stroke: #665438; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; opacity: 0; stroke-dasharray: 110; stroke-dashoffset: 110; }
  .piece, .yolk, .yolk-shine { opacity: 0; transform-box: fill-box; transform-origin: center; }
  .egg-button[data-stage="1"] .crack-one,
  .egg-button[data-stage="2"] .crack { opacity: 1; stroke-dashoffset: 0; transition: stroke-dashoffset 180ms var(--ease-out), opacity 80ms ease; }
  .egg-button[data-stage="1"] .egg-svg { animation: knock 160ms var(--ease-out); }
  .egg-button[data-stage="2"] .whole { opacity: 0; transition: opacity 70ms ease; }
  .egg-button[data-stage="2"] .piece, .egg-button[data-stage="2"] .yolk, .egg-button[data-stage="2"] .yolk-shine { opacity: 1; }
  .egg-button[data-stage="2"] .piece-left { animation: split-left 430ms var(--ease-out) both; }
  .egg-button[data-stage="2"] .piece-right { animation: split-right 430ms var(--ease-out) both; }
  .egg-button[data-stage="2"] .yolk, .egg-button[data-stage="2"] .yolk-shine { animation: yolk-pop 440ms var(--ease-out) both; }
  .egg-button[data-stage="2"]::after { transform: scaleX(1.22); opacity: .12; }
  .footer { min-height: 74px; display: grid; place-items: center; }
  .reset[hidden] { display: none; }
  .latency { margin: 8px 0 0; color: rgba(49,39,27,.68); font: 700 12px/1.4 "Trebuchet MS", sans-serif; }
  @keyframes knock { 35% { transform: rotate(-3deg) scale(.98); } 70% { transform: rotate(2deg) scale(1.01); } }
  @keyframes split-left { from { transform: translate(0,0) rotate(0); } to { transform: translate(-46px,30px) rotate(-16deg); } }
  @keyframes split-right { from { transform: translate(0,0) rotate(0); } to { transform: translate(46px,30px) rotate(16deg); } }
  @keyframes yolk-pop { from { transform: translateY(42px) scale(.92); } 70% { transform: translateY(-5px) scale(1.04); } to { transform: translateY(0) scale(1); } }
  @media (hover: hover) and (pointer: fine) { .back:hover, .reset:hover { background: #fffdf6; } }
  @media (max-height: 650px) { .egg-button { width: min(55vw, 225px); } .prompt { margin-top: 4px; } }
  @media (prefers-reduced-motion: reduce) {
    .egg-svg, .piece, .yolk, .yolk-shine { animation: none !important; transition-duration: 80ms !important; }
    .egg-button[data-stage="2"] .piece-left { transform: translate(-28px,18px) rotate(-9deg); }
    .egg-button[data-stage="2"] .piece-right { transform: translate(28px,18px) rotate(9deg); }
  }
</style>
</head>
<body>
<main class="game">
  <header class="topbar">
    <a class="back" href="./index.html" aria-label="협업 운영센터로 돌아가기">← 협업 운영센터</a>
    <h1 class="title">톡! 달걀깨기</h1>
    <span class="score" id="score" aria-live="polite">🥚 0개</span>
  </header>
  <section class="stage" aria-labelledby="prompt">
    <h2 class="prompt" id="prompt">달걀을 톡 건드려요</h2>
    <p class="sub" id="sub">두 번 터치하면 안에서 누가 나올까요?</p>
    <button class="egg-button" id="egg" type="button" data-stage="0" aria-label="달걀 깨기, 현재 멀쩡한 상태">
      <svg class="egg-svg" viewBox="0 0 300 390" role="img" aria-labelledby="egg-title egg-desc">
        <title id="egg-title">터치해서 깨는 달걀</title><desc id="egg-desc">첫 터치에 금이 가고 두 번째 터치에 깨집니다.</desc>
        <defs><linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf2"/><stop offset=".65" stop-color="#f5e9c8"/><stop offset="1" stop-color="#e7d3a5"/></linearGradient></defs>
        <g class="whole"><path class="shell" d="M150 18C86 18 43 139 43 229c0 83 46 139 107 139s107-56 107-139C257 139 214 18 150 18Z"/><path class="shine" d="M91 95c-20 38-29 79-30 111"/></g>
        <path class="crack crack-one" d="M151 112l-21 34 28 21-25 29 20 27"/>
        <path class="crack crack-two" d="M151 112l25 29-18 26 31 25-36 31-30 28"/>
        <g class="broken">
          <path class="piece piece-left shell" d="M43 229c0 83 46 139 107 139V223l-18-27 25-29-28-21 21-34C86 18 43 139 43 229Z"/>
          <path class="piece piece-right shell" d="M150 18c64 0 107 121 107 211 0 83-46 139-107 139V223l36-31-28-25 18-26-25-29Z"/>
          <ellipse class="yolk" cx="150" cy="280" rx="76" ry="63" fill="#f5a623" stroke="#d87d09" stroke-width="4"/>
          <ellipse class="yolk-shine" cx="126" cy="257" rx="18" ry="12" fill="#ffd66b" transform="rotate(-28 126 257)"/>
        </g>
      </svg>
    </button>
    <p class="latency" id="latency" aria-live="polite">터치 대기시간 없이 바로 반응합니다</p>
  </section>
  <footer class="footer"><button class="reset" id="reset" type="button" hidden>한 번 더 깨기</button></footer>
</main>
<script>
(function () {
  "use strict";
  var egg = document.getElementById("egg");
  var prompt = document.getElementById("prompt");
  var sub = document.getElementById("sub");
  var reset = document.getElementById("reset");
  var latency = document.getElementById("latency");
  var score = document.getElementById("score");
  var stage = 0;
  var crackedCount = 0;
  var ignoreClickUntil = 0;
  var audioContext = null;

  function playTapSound(nextStage) {
    var AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    try {
      if (!audioContext) audioContext = new AudioContext();
      if (audioContext.state === "suspended") audioContext.resume();
      var now = audioContext.currentTime;
      var oscillator = audioContext.createOscillator();
      var gain = audioContext.createGain();
      oscillator.type = nextStage === 2 ? "triangle" : "sine";
      oscillator.frequency.setValueAtTime(nextStage === 2 ? 220 : 520, now);
      oscillator.frequency.exponentialRampToValueAtTime(nextStage === 2 ? 95 : 300, now + .055);
      gain.gain.setValueAtTime(.0001, now);
      gain.gain.exponentialRampToValueAtTime(nextStage === 2 ? .18 : .11, now + .004);
      gain.gain.exponentialRampToValueAtTime(.0001, now + .07);
      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start(now);
      oscillator.stop(now + .075);
    } catch (_) {
      // 소리를 지원하지 않거나 차단한 환경에서도 게임 입력은 계속 처리한다.
    }
  }

  function advance(startedAt) {
    if (stage >= 2) return;
    playTapSound(stage + 1);
    stage += 1;
    egg.dataset.stage = String(stage);
    if (stage === 1) {
      prompt.textContent = "앗, 금이 갔어요!";
      sub.textContent = "한 번만 더 톡!";
      egg.setAttribute("aria-label", "달걀 깨기, 금이 간 상태");
    } else {
      prompt.textContent = "톡! 잘 깼어요";
      sub.textContent = "첫 미니게임 성공";
      egg.setAttribute("aria-label", "달걀이 깨진 상태");
      reset.hidden = false;
      if (navigator.vibrate) navigator.vibrate(22);
      crackedCount += 1;
      score.textContent = "🥚 " + crackedCount + "개";
    }
    requestAnimationFrame(function () {
      var elapsed = Math.max(0, Math.round(performance.now() - startedAt));
      latency.textContent = "입력 후 화면 반영 " + elapsed + "ms";
      document.dispatchEvent(new CustomEvent("eggstagechange", { detail: { stage: stage, latencyMs: elapsed } }));
    });
  }

  egg.addEventListener("pointerdown", function (event) {
    if (event.pointerType === "mouse" && event.button !== 0) return;
    ignoreClickUntil = performance.now() + 500;
    advance(performance.now());
  }, { passive: true });

  egg.addEventListener("click", function () {
    if (performance.now() < ignoreClickUntil) return;
    advance(performance.now());
  });

  reset.addEventListener("click", function () {
    playTapSound(1);
    stage = 0;
    egg.dataset.stage = "0";
    egg.setAttribute("aria-label", "달걀 깨기, 현재 멀쩡한 상태");
    prompt.textContent = "달걀을 톡 건드려요";
    sub.textContent = "두 번 터치하면 안에서 누가 나올까요?";
    latency.textContent = "터치 대기시간 없이 바로 반응합니다";
    reset.hidden = true;
    egg.focus();
  });

  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
}());
</script>
</body>
</html>
