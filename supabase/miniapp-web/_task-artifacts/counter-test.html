<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>카운터 테스트</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1e1e2f;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    text-align: center;
    background: #2a2a40;
    padding: 48px 64px;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  #count {
    font-size: 72px;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 24px;
  }
  button {
    font-size: 20px;
    padding: 14px 32px;
    border: none;
    border-radius: 8px;
    background: #4f8cff;
    color: #fff;
    cursor: pointer;
  }
  button:active {
    background: #3a6fd6;
  }
</style>
</head>
<body>
  <div class="card">
    <div id="count">0</div>
    <button id="incBtn">클릭 시 +1</button>
  </div>
  <script>
    let count = 0;
    const countEl = document.getElementById('count');
    document.getElementById('incBtn').addEventListener('click', function () {
      count += 1;
      countEl.textContent = count;
    });
  </script>
</body>
</html>
