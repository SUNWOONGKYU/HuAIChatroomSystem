<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1210" viewBox="0 0 1700 1210" role="img" aria-labelledby="t d">
  <title id="t">HuAI Collab Chatroom System 작업 흐름도 (2026-08-28)</title>
  <desc id="d">지시 한 줄이 결과물이 되기까지의 순서, 승인 카테고리 분리, 엔진이 한도에 걸렸을 때의 인계 규칙, 하루가 끝난 뒤의 보관과 정리 절차.</desc>

  <style>
    .bg{fill:#fafaf7}
    .lane{fill:#ffffff;stroke:#dce5de;stroke-width:2}
    .laneHead{fill:#eaf2ed;stroke:#dce5de;stroke-width:2}
    .step{fill:#ffffff;stroke:#5f6b7a;stroke-width:2}
    .stepOwner{fill:#eaf2ed;stroke:#2d6a4f;stroke-width:3}
    .stepAuto{fill:#fff8e7;stroke:#c9a961;stroke-width:3}
    .stepStop{fill:#ffffff;stroke:#b33a3a;stroke-width:3}
    .title{font:700 38px 'Malgun Gothic',Arial,sans-serif;fill:#0a1f14}
    .sub{font:20px 'Malgun Gothic',Arial,sans-serif;fill:#5f6b7a}
    .laneLabel{font:700 23px 'Malgun Gothic',Arial,sans-serif;fill:#2d6a4f}
    .stepHead{font:700 21px 'Malgun Gothic',Arial,sans-serif;fill:#0a1f14}
    .body{font:19px 'Malgun Gothic',Arial,sans-serif;fill:#3a3a30}
    .note{font:18px 'Malgun Gothic',Arial,sans-serif;fill:#5f6b7a}
    .edgeLabel{font:17px 'Malgun Gothic',Arial,sans-serif;fill:#5f6b7a}
    .flow{stroke:#2d6a4f;stroke-width:3;fill:none;marker-end:url(#a)}
    .flowGold{stroke:#c9a961;stroke-width:3;fill:none;marker-end:url(#ag)}
    .flowStop{stroke:#b33a3a;stroke-width:3;fill:none;marker-end:url(#ar)}
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d6a4f"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a961"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b33a3a"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1700" height="1210"/>

  <text class="title" x="60" y="70">HuAI Collab Chatroom System — 작업 흐름도</text>
  <text class="sub" x="60" y="104">지시 한 줄이 결과물이 되기까지. 협업 운영센터는 Telegram 메뉴 /center에서 연다</text>

  <!-- 1단: 정상 흐름 -->
  <rect class="lane" x="60" y="140" width="1580" height="330" rx="10"/>
  <rect class="laneHead" x="60" y="140" width="1580" height="48" rx="10"/>
  <text class="laneLabel" x="86" y="174">정상 흐름</text>

  <rect class="stepOwner" x="90" y="216" width="250" height="120" rx="8"/>
  <text class="stepHead" x="112" y="250">1. 지시</text>
  <text class="body" x="112" y="284">봇을 지목해 말한다</text>
  <text class="body" x="112" y="316">멘션·답장·이름 호출</text>

  <rect class="step" x="382" y="216" width="250" height="120" rx="8"/>
  <text class="stepHead" x="404" y="250">2. 접수·판단</text>
  <text class="body" x="404" y="284">즉시 접수를 알리고</text>
  <text class="body" x="404" y="316">파일 변경 여부까지 판단</text>

  <rect class="stepOwner" x="674" y="216" width="250" height="120" rx="8"/>
  <text class="stepHead" x="696" y="250">3. 제안·승인</text>
  <text class="body" x="696" y="284">목적·범위·완료조건</text>
  <text class="body" x="696" y="316">조회성 자동, 그 외 승인</text>

  <rect class="stepAuto" x="966" y="216" width="250" height="120" rx="8"/>
  <text class="stepHead" x="988" y="250">4. 실행</text>
  <text class="body" x="988" y="284">허용 폴더 안에서만</text>
  <text class="body" x="988" y="316">경과 시간을 계속 표시</text>

  <rect class="stepAuto" x="1258" y="216" width="250" height="120" rx="8"/>
  <text class="stepHead" x="1280" y="250">5. 결과물</text>
  <text class="body" x="1280" y="284">웹은 프리뷰로 배포</text>
  <text class="body" x="1280" y="316">문서는 파일로 업로드</text>

  <rect class="step" x="382" y="368" width="250" height="80" rx="8"/>
  <text class="stepHead" x="404" y="402">6. 자동 감사</text>
  <text class="body" x="404" y="432">작업자와 다른 엔진</text>

  <rect class="stepOwner" x="674" y="368" width="250" height="80" rx="8"/>
  <text class="stepHead" x="696" y="402">7. 완료 승인</text>
  <text class="body" x="696" y="432">협업 운영센터 승인 → 웹 승격</text>

  <rect class="step" x="966" y="368" width="542" height="80" rx="8"/>
  <text class="stepHead" x="988" y="402">보고가 300자를 넘으면</text>
  <text class="body" x="988" y="432">방에는 앞부분만. 전문은 협업 운영센터에서 읽는다</text>

  <path class="flow" d="M 340 276 L 382 276"/>
  <path class="flow" d="M 632 276 L 674 276"/>
  <path class="flow" d="M 924 276 L 966 276"/>
  <path class="flow" d="M 1216 276 L 1258 276"/>
  <path class="flow" d="M 1383 336 L 1383 356 L 507 356 L 507 368"/>
  <path class="flow" d="M 632 408 L 674 408"/>

  <!-- 2단: 엔진이 막혔을 때 -->
  <rect class="lane" x="60" y="500" width="770" height="420" rx="10"/>
  <rect class="laneHead" x="60" y="500" width="770" height="48" rx="10"/>
  <text class="laneLabel" x="86" y="534">엔진이 막혔을 때</text>

  <rect class="step" x="90" y="576" width="300" height="96" rx="8"/>
  <text class="stepHead" x="112" y="610">한도에 걸렸나?</text>
  <text class="body" x="112" y="642">CLI 자체 통보일 때만 인정</text>

  <rect class="stepAuto" x="450" y="576" width="350" height="96" rx="8"/>
  <text class="stepHead" x="472" y="610">아직 안 써 본 엔진으로</text>
  <text class="body" x="472" y="642">최대 2회 — 셋이 한 번씩</text>

  <rect class="step" x="90" y="712" width="300" height="96" rx="8"/>
  <text class="stepHead" x="112" y="746">한도가 아니면</text>
  <text class="body" x="112" y="778">넘기지 않고 실패 보고</text>

  <rect class="stepStop" x="450" y="712" width="350" height="96" rx="8"/>
  <text class="stepHead" x="472" y="746">셋 다 막히면 멈춘다</text>
  <text class="body" x="472" y="778">방에 알리고 더 넘기지 않음</text>

  <text class="note" x="90" y="856">감사는 작업자와 다른 엔진이 맡는다. 그 엔진만 남으면</text>
  <text class="note" x="90" y="884">그걸 쓰되 독립성이 낮다는 사실을 방에 밝힌다.</text>

  <path class="flowGold" d="M 390 624 L 450 624"/>
  <text class="edgeLabel" x="396" y="606">예</text>
  <path class="flowStop" d="M 240 672 L 240 712"/>
  <text class="edgeLabel" x="252" y="698">아니오</text>
  <path class="flowStop" d="M 625 672 L 625 712"/>
  <text class="edgeLabel" x="637" y="698">더 없으면</text>

  <!-- 3단: 하루가 끝나면 -->
  <rect class="lane" x="870" y="500" width="770" height="420" rx="10"/>
  <rect class="laneHead" x="870" y="500" width="770" height="48" rx="10"/>
  <text class="laneLabel" x="896" y="534">하루가 끝나면 (매일 00:10)</text>

  <rect class="stepAuto" x="900" y="576" width="330" height="118" rx="8"/>
  <text class="stepHead" x="922" y="610">1. 보관</text>
  <text class="body" x="922" y="644">어제까지 대화를 jsonl 로</text>
  <text class="body" x="922" y="676">Storage + 로컬 + 장부</text>

  <rect class="stepAuto" x="1280" y="576" width="330" height="118" rx="8"/>
  <text class="stepHead" x="1302" y="610">2. 요약</text>
  <text class="body" x="1302" y="644">하루치를 위키 한 장으로</text>
  <text class="body" x="1302" y="676">리더·감사가 이걸 읽는다</text>

  <rect class="step" x="900" y="726" width="710" height="118" rx="8"/>
  <text class="stepHead" x="922" y="760">3. 정리 점검 — 지우지는 않는다</text>
  <text class="body" x="922" y="794">장부에 있고, 60일이 지났고, 최신 40턴이 아닌 것만 대상</text>
  <text class="body" x="922" y="826">실제 삭제는 사람이 판단한다</text>

  <text class="note" x="900" y="884">순서를 뒤집지 않는다. 텔레그램은 지운 대화를 돌려주지 않는다.</text>

  <path class="flowGold" d="M 1230 634 L 1280 634"/>
  <path class="flowGold" d="M 1065 694 L 1065 726"/>

  <!-- 하단: 방장이 볼 화면 -->
  <rect class="lane" x="60" y="950" width="1580" height="196" rx="10"/>
  <rect class="laneHead" x="60" y="950" width="1580" height="48" rx="10"/>
  <text class="laneLabel" x="86" y="984">방장이 누르는 자리</text>

<text class="body" x="90" y="1024">Telegram은 지시·접수·진행 알림만. /center의 협업 운영센터에서 승인 · 보완 · 취소 (조회성 작업은 자동 시작)</text>
  <text class="body" x="90" y="1056">협업 운영센터에서 누르는 것: 승인(웹 산출물은 이때 프로덕션으로 승격) · 보완 요청</text>
  <text class="note" x="90" y="1088">자동 시작은 새 권한이 아니다 — 요청자가 원래 승인 권한이 없으면 조용히 무시되고 협업 운영센터의 승인 대기로 돌아간다.</text>
  <text class="note" x="90" y="1116">이미 결정이 끝난 건에 다시 누르면 그 사실을 방에 알린다 — 조용히 무시하지 않는다.</text>
</svg>
